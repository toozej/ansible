---
# Playbook to setup a basic fileserver
- name: Initialize file server environment
  hosts: all
  pre_tasks:
    - name: Set base_playbook Fact
      ansible.builtin.set_fact:
        base_playbook: "file-server.yml"
      when: base_playbook is not defined

- name: Setup file server
  hosts: all
  become: true
  become_user: root
  roles:
    - role: fs-common
    - role: file-server
    - role: monitoring-agent
