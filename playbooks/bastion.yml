---
# Playbook to setup a SSH bastion server
- name: Initialize bastion environment
  hosts: all
  pre_tasks:
    - name: Set base_playbook Fact
      ansible.builtin.set_fact:
        base_playbook: "bastion.yml"
      when: base_playbook is not defined

- name: Import common.yml
  ansible.builtin.import_playbook: common.yml
- name: Setup bastion
  hosts: all
  become: true
  become_user: root
  roles:
    - role: hardening
    - role: monitoring-agent
