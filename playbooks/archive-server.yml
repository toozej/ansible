---
# Playbook to setup an archive server system
- name: Initialize archive server environment
  hosts: all
  pre_tasks:
    - name: Set base_playbook Fact
      ansible.builtin.set_fact:
        base_playbook: "archive-server.yml"
      when: base_playbook is not defined

- name: Import common.yml
  ansible.builtin.import_playbook: common.yml
- name: Import docker-server.yml
  ansible.builtin.import_playbook: docker-server.yml
- name: Import file-server.yml
  ansible.builtin.import_playbook: file-server.yml
- name: Setup programs and tools
  hosts: all
  become: true
  become_user: root
  roles:
    - role: archive
    - role: hardening
