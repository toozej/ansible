---
# Playbook to setup a development environment inside a VM
- name: Initialize development vm environment
  hosts: all
  pre_tasks:
    - name: Set base_playbook Fact
      ansible.builtin.set_fact:
        base_playbook: "development-vm.yml"
      when: base_playbook is not defined

- name: Import common.yml
  ansible.builtin.import_playbook: common.yml
- name: Import docker-server.yml
  ansible.builtin.import_playbook: docker-server.yml
- name: Setup dev environment
  hosts: all
  become: true
  become_user: root
  roles:
    - role: dev-common
    - role: java
    - role: dev-aws
    - role: dev-ansible
    - role: dev-go
    - role: dev-python
    - role: dev-ruby
