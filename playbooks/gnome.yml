---
- name: Initialize gnome environment
  hosts: all
  pre_tasks:
    - name: Set base_playbook Fact
      ansible.builtin.set_fact:
        base_playbook: "gnome.yml"
      when: base_playbook is not defined

- name: Import common.yml
  ansible.builtin.import_playbook: common.yml
- name: Setup Gnome Desktop environment
  hosts: all
  become: true
  become_user: root
  roles:
    - role: flatpak
    - role: gui-common
    - role: gui-gnome
