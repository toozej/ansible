---
# Playbook to setup a laptop system
- name: Initialize linux laptop environment
  hosts: all
  pre_tasks:
    - name: Set base_playbook Fact
      ansible.builtin.set_fact:
        base_playbook: "linux-laptop.yml"
      when: base_playbook is not defined

- name: Import common.yml
  ansible.builtin.import_playbook: common.yml
- name: Setup physical hardware fixes
  hosts: all
  become: true
  become_user: root
  roles:
    - role: hp-spectre-13
    - role: physical

- name: Import docker-server.yml
  vars:
    docker_users: "[james]"

  # - import_playbook: virt-server.yml
  ansible.builtin.import_playbook: docker-server.yml
- name: Import gnome.yml
  ansible.builtin.import_playbook: gnome.yml
- name: Setup programs and tools
  hosts: all
  become: true
  become_user: root
  roles:
    - role: audio-cli
    - role: audio-gui
    - role: office
    - role: openvpn-client
    - role: wireguard
    - role: photography
    - role: fs-common

# - import_playbook: development.yml
