---
# Playbook to setup a Docker host
- name: Initialize docker server environment
  hosts: all
  pre_tasks:
    - name: Set base_playbook Fact
      ansible.builtin.set_fact:
        base_playbook: "docker-server.yml"
      when: base_playbook is not defined

- name: Setup Docker environment
  hosts: all
  become: true
  become_user: root
  gather_facts: true
  roles:
    - role: docker
    - role: wireguard
