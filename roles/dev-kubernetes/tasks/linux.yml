---
- name: Download Minikube
  ansible.builtin.get_url:
    url: https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
    dest: /usr/local/bin/minikube
    mode: "0755"

- name: Add James to the libvirt groups
  ansible.builtin.user:
    name: james
    groups: libvirt,kvm
    append: true

- name: Configure the Minikube driver
  ansible.builtin.command: minikube config set driver kvm2
  args:
    creates: /home/james/.minikube/config/config.json
  become: true
  become_user: james

- name: Read the current Kubectl release
  ansible.builtin.uri:
    url: https://dl.k8s.io/release/stable.txt
    return_content: true
  register: kubectl_release

- name: Download Kubectl
  ansible.builtin.get_url:
    url: https://dl.k8s.io/release/{{ kubectl_release.content | trim }}/bin/linux/amd64/kubectl
    dest: /usr/local/bin/kubectl
    mode: "0755"
