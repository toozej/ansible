---
- name: Upload rpmfusion repo GPG keys for Fedora
  ansible.builtin.copy:
    src: "files/{{ item }}"
    dest: "/tmp/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  with_items:
    - "RPM-GPG-KEY-rpmfusion-free-fedora-2020"
    - "RPM-GPG-KEY-rpmfusion-nonfree-fedora-2020"

- name: Import rpmfusion repo GPG keys for Fedora
  ansible.builtin.rpm_key:
    state: present
    key: "{{ item }}"
  with_items:
    - "/tmp/RPM-GPG-KEY-rpmfusion-free-fedora-2020"
    - "/tmp/RPM-GPG-KEY-rpmfusion-nonfree-fedora-2020"
  when: ansible_facts.distribution == 'Fedora'

- name: Install rpmfusion repo using dnf for Fedora
  ansible.builtin.dnf:
    name:
      - "https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_facts.distribution_version }}.noarch.rpm"
      - "https://download1.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_facts.distribution_version }}.noarch.rpm"
    state: present
    enablerepo: true
    update_cache: true
  when: ansible_facts.distribution == 'Fedora'
