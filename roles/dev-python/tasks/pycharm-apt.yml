---
- name: Create APT key directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add repository signing key
  ansible.builtin.get_url:
    url: https://s3.eu-central-1.amazonaws.com/jetbrains-ppa/0xA6E8698A.pub.asc
    dest: /etc/apt/keyrings/jetbrains.asc
    mode: "0644"

- name: "Apt | Ensure JetBrains repo present"
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/jetbrains.asc] http://jetbrains-ppa.s3-website.eu-central-1.amazonaws.com any main"
    state: present
    update_cache: true

- name: "Apt | Ensure JetBrains PyCharm Community latest instaled"
  ansible.builtin.apt:
    name: pycharm-community
    state: latest
