---
- name: "Flatpak | Force repair"
  ansible.builtin.command: "/usr/bin/flatpak repair"
  register: flatpak_repair_result
  changed_when: "'Nothing to do' not in flatpak_repair_result.stdout"
- name: "Flatpak | Install latest version of Pycharm"
  community.general.flatpak:
    name: com.jetbrains.PyCharm-Community
    state: present
    remote: flathub
  register: install_pycharm
  until: install_pycharm is not failed
  retries: 5
