---
# Load a variable file based on the OS type, or a default if not found.
- name: Load distribution variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "../vars/{{ ansible_facts.distribution }}-{{ ansible_facts.distribution_major_version | int }}.yml"
        - "../vars/{{ ansible_facts.distribution }}.yml"
        - "../vars/{{ ansible_facts.os_family }}.yml"
        - "../vars/default.yml"
      skip: true
  when: (pip3_package_name is not defined) or (python3_devtools_package_name is not defined) or (python3_package_name is not defined) or
    (python3_setuptools_package_name is not defined) or (python_virtualenv_package_name is not defined) or (ipython_package_name is not defined) or
    (pylint_package_name is not defined)

- name: Install the latest version of python3
  ansible.builtin.package:
    name: "{{ python3_package_name }}"
    state: latest

- name: Install the latest version of pip3
  ansible.builtin.package:
    name: "{{ pip3_package_name }}"
    state: latest

- name: Install the latest version of python3 development tools
  ansible.builtin.package:
    name: "{{ python3_devtools_package_name }}"
    state: latest

- name: Install the latest version of python3 setuptools
  ansible.builtin.package:
    name: "{{ python3_setuptools_package_name }}"
    state: latest

- name: Install the latest version of python virtualenv
  ansible.builtin.package:
    name: "{{ python_virtualenv_package_name }}"
    state: latest

- name: Install the latest version of ipython
  ansible.builtin.package:
    name: "{{ ipython_package_name }}"
    state: latest

- name: Install the latest version of pylint
  ansible.builtin.package:
    name: "{{ pylint_package_name }}"
    state: latest

- name: Include task file | pycharm-apt.yml
  ansible.builtin.include_tasks: "pycharm-apt.yml"
  when: (ansible_facts.pkg_mgr == "apt")
  tags: gui

- name: Include task file | pycharm-dnf.yml
  ansible.builtin.include_tasks: "pycharm-dnf.yml"
  when: (ansible_facts.pkg_mgr in ['dnf', 'dnf5'])
  tags: gui

- name: Include task file | pycharm-flatpak.yml
  ansible.builtin.include_tasks: "pycharm-flatpak.yml"
  when: (ansible_facts.pkg_mgr not in ['dnf', 'dnf5'] and ansible_facts.pkg_mgr != "apt")
  tags: gui

- name: Include task file | poetry.yml
  ansible.builtin.include_tasks: "poetry.yml"
