---
# Edition can be one of: 'ce' (Community Edition) or 'ee' (Enterprise Edition).
docker_edition: "ce"
docker_package: "docker-{{ docker_edition }}"

# Service options.
docker_service_state: started
docker_service_enabled: true
docker_restart_handler_state: restarted

# Docker Compose options.
docker_install_compose: true

# Used only for Debian/Ubuntu. Switch 'stable' to 'edge' if needed.
docker_apt_release_channel: stable
docker_apt_arch: >-
  {{ (ansible_facts.architecture == 'aarch64') | ternary('arm64',
     (ansible_facts.architecture == 'x86_64') | ternary('amd64', ansible_facts.architecture)) }}
docker_apt_repository: >-
  deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.asc]
  https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}
  {{ docker_distribution_release }} {{ docker_apt_release_channel }}
docker_distribution_release: "{{ ansible_facts.distribution_release }}"

# Used only for RedHat/CentOS/Fedora.
docker_yum_repo_url: https://download.docker.com/linux/{{ (ansible_facts.distribution == "Fedora") | ternary("fedora", "centos") }}/docker-{{ docker_edition
  }}.repo
docker_supported_distribution_version: 39
