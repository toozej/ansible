---
- name: Include task file | setup-RedHat.yml
  ansible.builtin.include_tasks: setup-RedHat.yml
  when: ansible_facts.os_family == 'RedHat'

- name: Include task file | setup-Debian.yml
  ansible.builtin.include_tasks: setup-Debian.yml
  when: ansible_facts.os_family == 'Debian'

- name: Install Docker
  ansible.builtin.package:
    name: "{{ docker_package }}"
    state: latest
  notify: Restart docker

- name: Install the distribution Docker Python library
  ansible.builtin.package:
    name: python3-docker
    state: present

# Docker must be stopped to work Docker in Docker (testing with Jenkins)
- name: Ensure Docker is stopped and enabled at boot.
  ansible.builtin.service:
    name: docker
    state: "{{ docker_service_state }}"
    enabled: "{{ docker_service_enabled }}"
  when: (ansible_facts.service_mgr == "systemd") or (ansible_facts.service_mgr == "upstart")

- name: Include task file | docker-compose.yml
  ansible.builtin.include_tasks: docker-compose.yml
  when: docker_install_compose

- name: Include task file | docker-users.yml
  ansible.builtin.include_tasks: docker-users.yml

- name: Ensure handlers are notified now to avoid firewall conflicts.
  ansible.builtin.meta: flush_handlers
  tags: ci
