---
- name: Ensure old versions of Docker are not installed.
  ansible.builtin.package:
    name:
      - docker
      - docker-common
      - docker-engine
    state: absent

- name: Add Docker GPG key.
  ansible.builtin.rpm_key:
    key: https://download.docker.com/linux/fedora/gpg
    state: present

- name: Add Docker repository.
  ansible.builtin.get_url:
    url: "{{ docker_yum_repo_url }}"
    dest: "/etc/yum.repos.d/docker-{{ docker_edition }}.repo"
    owner: root
    group: root
    mode: "0644"

- name: If using unsupported distribution version for Docker, replace with working one
  when: ansible_facts.distribution == "Fedora" and (ansible_facts.distribution_version == "38" or ansible_facts.distribution_version == "39")
  ansible.builtin.replace:
    path: /etc/yum.repos.d/docker-{{ docker_edition }}.repo
    regexp: \$releasever
    replace: "{{ docker_supported_distribution_version }}"
