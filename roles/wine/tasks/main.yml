---
# Load a variable file based on the OS type, or a default if not found.
- name: Load distribution variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "../vars/{{ ansible_facts.distribution }}-{{ ansible_facts.distribution_major_version | int }}.yml"
        - "../vars/{{ ansible_facts.distribution }}.yml"
        - "../vars/{{ ansible_facts.os_family }}.yml"
        - "../vars/default.yml"
      skip: true
  when: (wine_package_name is not defined)

- name: Install latest version of Wine
  ansible.builtin.package:
    name: "{{ wine_package_name }}"
    state: latest

- name: Install latest version of Winetricks
  ansible.builtin.package:
    name: winetricks
    state: latest
