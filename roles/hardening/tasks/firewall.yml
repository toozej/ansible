---
- name: Ensure firewalld is installed.
  ansible.builtin.package:
    name: firewalld
    state: latest

# to work around bug https://github.com/saltstack/salt/issues/55110
- name: Update the repository cache and update package "iptables" to latest version using default release buster-backports
  ansible.builtin.apt:
    name: iptables
    state: latest
    default_release: buster-backports
    update_cache: true
  when: (ansible_facts.distribution == 'Debian' and ansible_facts.distribution_major_version is version('10', 'eq'))

- name: Ensure firewalld Python 3 bindings are installed
  ansible.builtin.package:
    name: python3-firewall
    state: latest
  when: (ansible_facts.distribution != 'Debian' and ansible_facts.distribution_major_version is not version('10', 'eq'))

- name: Start and enable firewalld
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true

- name: Configure firewall zones
  ansible.builtin.include_tasks: firewall-zones.yml

- name: Configure common firewall rules
  ansible.builtin.include_tasks: firewall-rules-common.yml

- name: Disable other firewalls
  ansible.builtin.include_tasks: disable-other-firewalls.yml
  when: (firewall_disable_iptables or firewall_disable_ufw)
