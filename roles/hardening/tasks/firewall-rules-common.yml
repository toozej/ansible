---
- name: Allow services
  ansible.posix.firewalld:
    service: "{{ item }}"
    zone: "{{ default_zone }}"
    permanent: true
    state: enabled
  notify:
    - reload firewalld
    - check firewalld config
  with_items: "{{ firewall_allowed_services }}"

- name: Allow local network traffic
  ansible.posix.firewalld:
    source: 192.168.1.0/24
    zone: "{{ default_zone }}"
    permanent: true
    state: enabled
  notify:
    - reload firewalld
    - check firewalld config
  when: "default_zone != 'home'"

- name: Allow monitoring agents
  ansible.posix.firewalld:
    port: "{{ item }}"
    zone: "{{ default_zone }}"
    permanent: true
    state: enabled
  notify:
    - reload firewalld
    - check firewalld config
  with_items:
    - 8903/tcp
    - 8903/udp
    - 45876/tcp
    - 45876/udp

- name: Allow TCP ports
  ansible.posix.firewalld:
    port: "{{ item }}/tcp"
    zone: "{{ default_zone }}"
    permanent: true
    state: enabled
  notify:
    - reload firewalld
    - check firewalld config
  with_items: "{{ firewall_allowed_tcp_ports }}"

- name: Allow UDP ports
  ansible.posix.firewalld:
    port: "{{ item }}/udp"
    zone: "{{ default_zone }}"
    permanent: true
    state: enabled
  notify:
    - reload firewalld
    - check firewalld config
  with_items: "{{ firewall_allowed_udp_ports }}"

- name: Forward TCP ports
  ansible.posix.firewalld:
    rich_rule: rule family=ipv4 forward-port port="{{ item }}" protocol=tcp to-port="{{ item }}"
    zone: "{{ default_zone }}"
    permanent: true
    state: enabled
  notify:
    - reload firewalld
    - check firewalld config
  with_items: "{{ firewall_forwarded_tcp_ports }}"

- name: Forward UDP ports
  ansible.posix.firewalld:
    rich_rule: rule family=ipv4 forward-port port="{{ item }}" protocol=udp to-port="{{ item }}"
    zone: "{{ default_zone }}"
    permanent: true
    state: enabled
  notify:
    - reload firewalld
    - check firewalld config
  with_items: "{{ firewall_forwarded_udp_ports }}"
