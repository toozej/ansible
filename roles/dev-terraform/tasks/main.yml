---
- name: Install latest version of Terraform using APT
  ansible.builtin.include_tasks: setup-apt.yml
  when: ansible_facts.pkg_mgr == 'apt'

- name: Install latest version of Terraform using DNF
  ansible.builtin.include_tasks: setup-dnf.yml
  when: ansible_facts.pkg_mgr in ['dnf', 'dnf5']

- name: Setup Terraform Local Environment
  ansible.builtin.include_tasks: setup-environment.yml
