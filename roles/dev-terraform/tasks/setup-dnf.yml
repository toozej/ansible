---
- name: Include RedHat ansible_facts.distribution_release for RHEL
  ansible.builtin.include_vars: "../vars/RedHat.yml"
  when: ansible_facts.distribution == 'RedHat' or ansible_facts.distribution == 'CentOS'

- name: Include Fedora ansible_facts.distribution_release for fedora
  ansible.builtin.include_vars: "../vars/Fedora.yml"
  when: ansible_facts.distribution == 'Fedora'

- name: Add Hashicorp repo
  ansible.builtin.yum_repository:
    name: hashicorp
    description: "Hashicorp Stable repository"
    baseurl: "https://rpm.releases.hashicorp.com/{{ terraform_distribution }}/$releasever/x86_64/stable"
    gpgkey: https://rpm.releases.hashicorp.com/gpg
    gpgcheck: true
    enabled: true

- name: If using unsupported distribution version for Terraform, replace with working one
  when: ansible_facts.distribution == "Fedora" and (ansible_facts.distribution_version == "38" or ansible_facts.distribution_version == "39")

  ansible.builtin.replace:
    path: /etc/yum.repos.d/hashicorp.repo
    regexp: \$releasever
    replace: "{{ terraform_supported_distribution_version }}"
- name: "Dnf | Ensure Terraform present"
  ansible.builtin.dnf:
    name: terraform
    state: latest
