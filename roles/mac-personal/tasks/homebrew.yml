---
- name: Determine Homebrew ownership variables
  ansible.builtin.set_fact:
    homebrew_user: "{{ homebrew_user | default(ansible_facts.user_id) }}"
    homebrew_group: "{{ homebrew_group | default(ansible_facts.user_gid) }}"

- name: Import personal-related defaults
  ansible.builtin.include_vars:
    file: ../defaults/personal.yml

- name: Configure role
  block:
  # taps personal
    - name: Ensure configured personal taps are tapped.
      community.general.homebrew_tap:
        tap: "{{ item.name | default(item) }}"
        url: "{{ item.url | default(omit) }}"
        state: present
      loop: "{{ homebrew_taps_personal }}"
      become_user: "{{ homebrew_user }}"
      become: true
    - name: Trust configured taps.
      ansible.builtin.shell: |
        set -o pipefail
        brew trust '{{ item.name | default(item) }}'
      loop: "{{ homebrew_taps }}"
      become_user: "{{ homebrew_user }}"
      become: true
      args:
        executable: /bin/bash
      register: homebrew_trust_result
      changed_when: "'already trusted' not in homebrew_trust_result.stdout"
    - name: Install configured personal-related cask applications.
      community.general.homebrew_cask:
        name: "{{ item.name | default(item) }}"
        state: present
        install_options: "{{ item.install_options | default('appdir=' + homebrew_cask_appdir) }}"
        accept_external_apps: "{{ homebrew_cask_accept_external_apps }}"
      loop: "{{ homebrew_cask_apps_personal }}"
      become_user: "{{ homebrew_user }}"
      become: true
    - name: Ensure configured personal-related homebrew packages are installed.
      community.general.homebrew:
        name: "{{ item.name | default(item) }}"
        install_options: "{{ item.install_options | default(omit) }}"
        state: present
      loop: "{{ homebrew_installed_packages_personal }}"
      become_user: "{{ homebrew_user }}"
      become: true
