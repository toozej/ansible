---
- name: Install homebrew
  ansible.builtin.include_tasks: homebrew.yml

- name: Install applications via MacOS App Store
  ansible.builtin.include_tasks: mas.yml

- name: Read the startup chime setting
  ansible.builtin.command: nvram StartupMute
  register: startup_mute
  changed_when: false
  failed_when: startup_mute.rc not in [0, 1]
- name: Enable startup chime
  # https://mrmacintosh.com/how-to-enable-the-mac-startup-chime-on-your-2016-macbook-pro/
  ansible.builtin.command: nvram StartupMute=%00
  when: "'%00' not in startup_mute.stdout"
  changed_when: true
- name: Install llm plugins
  ansible.builtin.command: "llm install {{ item }}"
  with_items:
    - llm-anthropic
    - llm-gemini
    - llm-ollama
    - llm-commit
    - llm-fragments-github
    - llm-fragments-go
    - llm-github-models

  register: llm_plugin_install
  changed_when: "'Successfully installed' in llm_plugin_install.stdout"
- name: Install sncli with uv
  ansible.builtin.command: "uv tool install sncli --python=3.11"
  args:
    creates: /Users/{{ homebrew_user }}/.local/bin/sncli
