---
- name: Tweaks for DNF
  ansible.builtin.include_tasks: dnf.yml
  when: ansible_facts.pkg_mgr in ['dnf', 'dnf5']

- name: Install VIM
  ansible.builtin.include_tasks: vim.yml

- name: Install and configure SSH
  ansible.builtin.include_tasks: ssh.yml

- name: Install tools and utilities
  ansible.builtin.include_tasks: tools.yml

- name: Install and configure GPG
  ansible.builtin.include_tasks: gpg.yml

- name: Install and configure tmux
  ansible.builtin.include_tasks: tmux.yml

- name: Remove default /etc/issue.d/*
  ansible.builtin.include_tasks: issue.yml

- name: Install latest version of fetch tool
  ansible.builtin.include_tasks: fetch.yml
  when: (ansible_facts.distribution != 'CentOS') and (ansible_facts.distribution == 'Debian' and ansible_facts.distribution_major_version != 'n/a')
