---
- name: Load distribution variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "../vars/{{ ansible_facts.distribution }}-{{ ansible_facts.distribution_major_version | int }}.yml"
        - "../vars/{{ ansible_facts.distribution }}.yml"
        - "../vars/{{ ansible_facts.os_family }}-{{ ansible_facts.distribution_major_version | int }}.yml"
        - "../vars/{{ ansible_facts.os_family }}.yml"
        - "../vars/default.yml"
      skip: true
  when: (gnupg_package_name is not defined)

- name: Install the latest version of gnupg (GPG)
  ansible.builtin.package:
    name: "{{ gnupg_package_name }}"
    state: latest

- name: Install the latest version of gnupg-agent (gpg-agent)
  ansible.builtin.package:
    name: gnupg-agent
    state: latest
  when: ansible_facts.os_family == 'Debian'

- name: Install the latest version of rng-tools
  ansible.builtin.package:
    name: rng-tools
    state: latest
