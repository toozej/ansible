---
- name: Install homebrew
  ansible.builtin.include_tasks: homebrew.yml

- name: Configure MacOS Defaults
  ansible.builtin.include_tasks: macos-defaults.yml

- name: Install applications via MacOS App Store
  ansible.builtin.include_tasks: mas.yml

- name: Setup PyCharm helper script
  ansible.builtin.copy:
    src: pycharm-helper
    dest: /usr/local/bin/pycharm
    owner: "{{ homebrew_user }}"
    group: "{{ homebrew_group }}"
    mode: "0644"
