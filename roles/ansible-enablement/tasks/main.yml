---
# Load a variable file based on the OS type, or a default if not found.
- name: Include vars and defaults
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "../vars/{{ ansible_facts.distribution }}-{{ ansible_facts.distribution_major_version | int }}.yml"
        - "../vars/{{ ansible_facts.distribution }}.yml"
        - "../vars/{{ ansible_facts.os_family }}-{{ ansible_facts.distribution_major_version | int }}.yml"
        - "../vars/{{ ansible_facts.os_family }}.yml"
        - "../vars/default.yml"
      skip: true
  when: (libselinux_package_name is not defined)

- name: Include RPMFusion repo on RedHat-based systems
  ansible.builtin.include_role:
    name: "repo-extra"
  when: ansible_facts.os_family == 'RedHat'

- name: Install DNF plugins
  ansible.builtin.package:
    name: "{{ 'dnf5-plugins' if ansible_facts.pkg_mgr == 'dnf5' else 'dnf-plugins-core' }}"
    state: latest
  when: ansible_facts.pkg_mgr in ['dnf', 'dnf5']

- name: Install apt-transport-https
  ansible.builtin.package:
    name: apt-transport-https
    state: present
  when: (ansible_facts.pkg_mgr == 'apt')
