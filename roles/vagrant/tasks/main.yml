---
- name: Install vagrant
  ansible.builtin.package:
    name: vagrant
    state: latest

- name: Install latest version of virt-manager
  ansible.builtin.package:
    name: virt-manager
    state: latest

- name: Install bridge-utils networking
  ansible.builtin.package:
    name: bridge-utils
    state: latest

- name: Install vagrant libvirt provider on modern distros
  ansible.builtin.include_tasks: vagrant_providers_libvirt.yml

- name: Install vagrant plugins on modern distros
  ansible.builtin.include_tasks: vagrant_plugins.yml
