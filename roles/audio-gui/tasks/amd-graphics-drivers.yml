---
# info from https://www.schotty.com/EL_And_Fedora/amdgpu_Plus_Fedora/
- name: Install AMD drivers
  ansible.builtin.package:
    name:
      - mesa-dri-drivers
      - mesa-vulkan-drivers
    state: latest

- name: Install AMD-centric codecs and other tools
  ansible.builtin.package:
    name:
      - libva
      - libva-utils
      - vulkan-tools
      - vulkan-loader
    state: latest

- name: Read kernel arguments
  ansible.builtin.command: grubby --info=ALL
  register: graphics_kernel_args
  changed_when: false
- name: Update kernel options
  ansible.builtin.command: grubby --update-kernel=ALL --args="amdgpu.dc=0 radeon.cik_support=0 amdgpu.cik_support=1"
  when: "'amdgpu.dc=0 radeon.cik_support=0 amdgpu.cik_support=1' not in graphics_kernel_args.stdout"
  changed_when: true
