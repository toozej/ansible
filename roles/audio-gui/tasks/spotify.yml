---
- name: "Flatpak | Force repair"
  ansible.builtin.command: "/usr/bin/flatpak repair"
  register: flatpak_repair_result
  changed_when: "'Nothing to do' not in flatpak_repair_result.stdout"
- name: "Flatpak | Install latest version of Spotify installer"
  community.general.flatpak:
    name: com.spotify.Client
    state: present
    remote: flathub
  register: install_spotify
  until: install_spotify is not failed
  retries: 5
