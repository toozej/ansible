---
# Load a variable file based on the OS type, or a default if not found.
- name: Load distribution variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "../vars/{{ ansible_facts.distribution }}-{{ ansible_facts.distribution_major_version | int }}.yml"
        - "../vars/{{ ansible_facts.distribution }}.yml"
        - "../vars/{{ ansible_facts.os_family }}.yml"
        - "../vars/default.yml"
      skip: true
  when: (wireguard_package_name is not defined)

- name: Install wireguard package
  ansible.builtin.package:
    name: "{{ wireguard_package_name }}"
    state: latest

- name: Install wireguard tools package for Debian-based systems
  ansible.builtin.package:
    name: wireguard-tools
    state: latest
  when: ansible_facts.os_family == 'Debian'

- name: Create wireguard config directory
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    mode: "0700"
