---
- name: Read the current Go releases
  ansible.builtin.uri:
    url: https://go.dev/dl/?mode=json
    return_content: true
  register: go_release
  when: go_version_override | default('') | length == 0

- name: Select the Go release
  ansible.builtin.set_fact:
    go_version_target: "{{ go_version_override if go_version_override | default('') | length > 0 else go_release.json[0].version | regex_replace('^go', '') }}"

- name: Set the Go archive name
  ansible.builtin.set_fact:
    go_tarball: go{{ go_version_target }}.linux-amd64.tar.gz

- name: Download Go
  ansible.builtin.get_url:
    url: https://go.dev/dl/{{ go_tarball }}
    dest: /usr/local/src/{{ go_tarball }}
    mode: "0644"

- name: Read the installed Go version
  ansible.builtin.command: /usr/local/go/bin/go version
  register: go_version
  changed_when: false
  failed_when: go_version.rc not in [0, 2]

- name: Replace the Go installation
  when: go_version.rc != 0 or ('go' ~ go_version_target ~ ' ') not in go_version.stdout
  block:
    - name: Remove the old Go installation
      ansible.builtin.file:
        path: /usr/local/go
        state: absent

    - name: Extract Go
      ansible.builtin.unarchive:
        src: /usr/local/src/{{ go_tarball }}
        dest: /usr/local
        remote_src: true

- name: Add Go to the system PATH
  ansible.builtin.copy:
    src: go-bin.sh
    dest: /etc/profile.d/go-bin.sh
    mode: "0644"

- name: Install additional Go tools
  ansible.builtin.include_tasks: additional_go_binaries.yml
