---
# test playbook
- name: Initialize gui dev environment
  hosts: localhost
  connection: local
  pre_tasks:
    - name: Set base_playbook Fact
      ansible.builtin.set_fact:
        base_playbook: "gui-dev.yml"
      when: base_playbook is not defined

- name: Configure gui dev environment
  hosts: localhost
  connection: local
  become: true
  become_user: root
  roles:
    - role: ansible-enablement
    - role: common
    - role: user
    - role: flatpak
    - role: java
    - role: dev-common
    - role: dev-gui
    - role: docker
    - role: gui-common
    - role: repo-extra
    - role: unattended-upgrades
    - role: wireguard
