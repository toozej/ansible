---
# test playbook
- name: Initialize dev environment
  hosts: localhost
  connection: local
  pre_tasks:
    - name: Set base_playbook Fact
      ansible.builtin.set_fact:
        base_playbook: "dev.yml"
      when: base_playbook is not defined

- name: Configure dev environment
  hosts: localhost
  connection: local
  become: true
  become_user: root
  roles:
    - role: ansible-enablement
    - role: common
    - role: user
    - role: flatpak
    - role: java
    - role: dev-common
    - role: dev-gui
    - role: dev-ansible
    - role: dev-aws
    - role: dev-go
    - role: dev-python
    - role: dev-ruby
    - role: docker
    # dev-kubernetes and dev-terraform require kvm
    - role: virt-server
    - role: dev-kubernetes
    - role: dev-terraform
