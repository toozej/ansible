---
# test playbook
- name: Initialize gui environment
  hosts: localhost
  connection: local
  pre_tasks:
    - name: Set base_playbook Fact
      ansible.builtin.set_fact:
        base_playbook: "gui.yml"
      when: base_playbook is not defined

- name: Configure gui environment
  hosts: localhost
  connection: local
  become: true
  become_user: root
  roles:
    - role: ansible-enablement
    - role: common
    - role: user
    - role: flatpak
    - role: audio-cli
    - role: audio-gui
    - role: gui-common
    - role: gui-i3
    - role: gui-gnome
    - role: office
    - role: physical
