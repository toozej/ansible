---
# test playbook
- name: Initialize server environment
  hosts: localhost
  connection: local
  pre_tasks:
    - name: Set base_playbook Fact
      ansible.builtin.set_fact:
        base_playbook: "server.yml"
      when: base_playbook is not defined

- name: Configure server environment
  hosts: localhost
  connection: local
  become: true
  become_user: root
  roles:
    - role: ansible-enablement
    - role: common
    - role: user
    - role: flatpak
    - role: docker
    - role: fs-common
    - role: file-server
    - role: monitoring-agent
    - role: physical
    - role: repo-extra
    - role: unattended-upgrades
    - role: virt-server
    - role: wireguard
