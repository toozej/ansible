---
# test playbook
- name: Initialize gui gaming environment
  hosts: localhost
  connection: local
  pre_tasks:
    - name: Set base_playbook Fact
      ansible.builtin.set_fact:
        base_playbook: "gui-gaming.yml"
      when: base_playbook is not defined

- name: Configure gui gaming environment
  hosts: localhost
  connection: local
  become: true
  become_user: root
  roles:
    - role: ansible-enablement
    - role: common
    - role: user
    - role: flatpak
    - role: gaming
    - role: gui-common
    - role: gui-i3
    - role: gui-gnome
    - role: photography
    - role: wine
