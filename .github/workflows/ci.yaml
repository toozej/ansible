---
name: CI
"on":
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 1 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ANSIBLE_ROLES_PATH: ${{ github.workspace }}/roles
  ANSIBLE_INJECT_FACT_VARS: "false"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    container: python:3.13-slim-trixie
    steps:
      - name: Install Git
        run: apt-get update && apt-get install -y --no-install-recommends git
      - name: Check repository
        uses: actions/checkout@v7.0.1
      - name: Install lint dependencies
        run: |
          python -m pip install -r requirements-lint.txt
          ansible-galaxy collection install -r requirements.yml
      - name: Check YAML
        run: yamllint --strict .
      - name: Check Ansible
        run: ansible-lint --strict

  compatibility:
    name: Python ${{ matrix.python }} / core ${{ matrix.core }}
    runs-on: ubuntu-latest
    container: python:${{ matrix.python }}-slim-trixie
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.11", core: "2.19" }
          - { python: "3.12", core: "2.19" }
          - { python: "3.13", core: "2.19" }
          - { python: "3.12", core: "2.20" }
          - { python: "3.13", core: "2.20" }
          - { python: "3.14", core: "2.20" }
          - { python: "3.12", core: "2.21" }
          - { python: "3.13", core: "2.21" }
          - { python: "3.14", core: "2.21" }
    steps:
      - name: Install Git
        run: apt-get update && apt-get install -y --no-install-recommends git
      - name: Check repository
        uses: actions/checkout@v7.0.1
      - name: Install Ansible and collections
        env:
          ANSIBLE_CORE: ${{ matrix.core }}
        run: |
          python -m pip install -r requirements.txt "ansible-core==${ANSIBLE_CORE}.*"
          ansible-galaxy collection install -r requirements.yml
      - name: Check syntax and compatibility
        run: python tests/validate.py

  distribution:
    name: Debian 13 packages
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - name: Install distribution packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ansible ca-certificates git python3
      - name: Check repository
        uses: actions/checkout@v7.0.1
      - name: Check syntax and compatibility
        run: python3 tests/validate.py

  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
